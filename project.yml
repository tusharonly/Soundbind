name: Soundbind
options:
  bundleIdPrefix: io.github.tusharonly
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minorVersion: 3.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
targets:
  Soundbind:
    type: application
    platform: macOS
    sources:
      - path: Soundbind
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Soundbind/Resources/Info.plist
      properties:
        CFBundleDisplayName: Soundbind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Tushar Ghige. MIT License."
    entitlements:
      path: Soundbind/Resources/Soundbind.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: Soundbind
        SWIFT_OBJC_BRIDGING_HEADER: Soundbind/Support/Soundbind-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tusharonly.soundbind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
  SoundbindTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SoundbindTests
    dependencies:
      - target: Soundbind
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tusharonly.soundbind.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Soundbind.app/Contents/MacOS/Soundbind
schemes:
  Soundbind:
    build:
      targets:
        Soundbind: all
        SoundbindTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoundbindTests
